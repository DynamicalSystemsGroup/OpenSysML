<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Waiting and execution both extend completion</title><desc id="desc">Five selected actual job intervals from a 44-job historical full run. Corpus-sweep is the last Go job to finish. Other lanes are omitted and remain in the full timeline.</desc><rect width="1000" height="390" fill="white"/><g font-family="Arial,sans-serif" fill="#17212b"><text x="20" y="30" font-size="21" >Waiting and execution both extend completion</text><text x="20" y="54" font-size="13" >A historical full run took 54.1 minutes. Five actual job lanes shown; 39 omitted.</text><text x="20" y="80" font-size="12" >Orange: gap after prerequisite   Blue: Go test step   Gray: other execution</text><line x1="245.0" y1="102" x2="245.0" y2="286" stroke="#e2e8f0"/><text x="245.0" y="99" font-size="12" >0</text><line x1="361.66666666666663" y1="102" x2="361.66666666666663" y2="286" stroke="#e2e8f0"/><text x="361.66666666666663" y="99" font-size="12" >10</text><line x1="478.3333333333333" y1="102" x2="478.3333333333333" y2="286" stroke="#e2e8f0"/><text x="478.3333333333333" y="99" font-size="12" >20</text><line x1="595.0" y1="102" x2="595.0" y2="286" stroke="#e2e8f0"/><text x="595.0" y="99" font-size="12" >30</text><line x1="711.6666666666666" y1="102" x2="711.6666666666666" y2="286" stroke="#e2e8f0"/><text x="711.6666666666666" y="99" font-size="12" >40</text><line x1="828.3333333333333" y1="102" x2="828.3333333333333" y2="286" stroke="#e2e8f0"/><text x="828.3333333333333" y="99" font-size="12" >50</text><line x1="945.0" y1="102" x2="945.0" y2="286" stroke="#e2e8f0"/><text x="945.0" y="99" font-size="12" >60</text><text x="20" y="136" font-size="14" >Changed areas</text><rect x="245.0" y="122" width="10.11111111111111" height="18" fill="#94a3b8"/><text x="20" y="170" font-size="14" >Go (export-corpus)</text><line x1="255.11111111111111" y1="164" x2="295.3611111111111" y2="164" stroke="#b45309" stroke-width="3" stroke-dasharray="4 3"/><rect x="295.3611111111111" y="156" width="467.0555555555555" height="18" fill="#94a3b8"/><rect x="308.77777777777777" y="156" width="453.0555555555555" height="18" fill="#2563eb" opacity="0.45"/><text x="20" y="204" font-size="14" >Go (export-library)</text><line x1="255.11111111111111" y1="198" x2="306.44444444444446" y2="198" stroke="#b45309" stroke-width="3" stroke-dasharray="4 3"/><rect x="306.44444444444446" y="190" width="250.24999999999997" height="18" fill="#94a3b8"/><rect x="331.1388888888889" y="190" width="224.58333333333331" height="18" fill="#2563eb" opacity="0.45"/><text x="20" y="238" font-size="14" font-weight="600">Go (corpus-sweep)</text><line x1="255.11111111111111" y1="232" x2="339.5" y2="232" stroke="#b45309" stroke-width="3" stroke-dasharray="4 3"/><rect x="339.5" y="224" width="512.7499999999999" height="18" fill="#94a3b8"/><rect x="355.25" y="224" width="496.41666666666663" height="18" fill="#2563eb" opacity="1"/><text x="20" y="272" font-size="14" >Build and test</text><rect x="875.5833333333333" y="258" width="2" height="18" fill="#94a3b8"/><text x="245" y="310" font-size="12" >Minutes after first recorded step</text><text x="20" y="341" font-size="15" >Last Go job. 7.2 minutes before execution, then 44.0 minutes executing.</text><text x="20" y="366" font-size="12" >The wait has no confirmed cause. If corpus-sweep finishes sooner, another job can finish last.</text></g></svg>